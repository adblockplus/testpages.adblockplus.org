repos:
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.156.0
    hooks:
      - id: semgrep
        args:
          - --config=p/security-audit
          - --config=p/r2c
          - --config=p/owasp-top-ten
          - --config=p/javascript
          - --config=p/nodejs
          - --config=p/golang
          - --config=p/python
          - --error
          - --quiet
          - --metrics=off

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-current
        name: Gitleaks (manual) - scan all current files
        entry: gitleaks dir . --redact --verbose
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: gitleaks
        alias: gitleaks-history
        name: Gitleaks (manual) - scan full git history
        entry: gitleaks git . --redact --verbose
        pass_filenames: false
        always_run: true
        stages: [manual]

  - repo: local
    hooks:
      - id: eslint
        name: ESLint (optional)
        entry: bash -c 'if [ -x ./node_modules/.bin/eslint ]; then exec ./node_modules/.bin/eslint "$@"; else echo "ESLint not installed - skipping optional hook"; fi' --
        language: system
        types_or: [javascript, jsx, ts, tsx]
